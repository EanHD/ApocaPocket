<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">TARP SHELTERS</text>

<!-- Dividers for 3 configs -->
<line x1="0" y1="18" x2="240" y2="18" stroke="#333" stroke-width="1"/>
<line x1="0" y1="95" x2="240" y2="95" stroke="#333" stroke-width="1"/>
<line x1="0" y1="168" x2="240" y2="168" stroke="#333" stroke-width="1"/>

<!-- A-FRAME (top, y=18-95) -->
<text x="14" y="30" font-family="monospace" font-size="11" fill="#00FFFF">A-FRAME</text>
<!-- Two trees (vertical lines) -->
<rect x="30" y="32" width="6" height="58" rx="2" fill="#664422"/>
<rect x="200" y="32" width="6" height="58" rx="2" fill="#664422"/>
<!-- Ridge line -->
<line x1="36" y1="38" x2="200" y2="38" stroke="#FFFF00" stroke-width="2" stroke-dasharray="5,3"/>
<!-- Tarp sides -->
<line x1="36" y1="38" x2="20" y2="85" stroke="#00FFFF" stroke-width="2"/>
<line x1="200" y1="38" x2="216" y2="85" stroke="#00FFFF" stroke-width="2"/>
<line x1="20" y1="85" x2="216" y2="85" stroke="#555" stroke-width="1"/>
<!-- Fill tarp -->
<polygon points="36,38 200,38 216,85 20,85" fill="#00FFFF" fill-opacity="0.12"/>
<!-- Stakes -->
<line x1="20" y1="85" x2="14" y2="93" stroke="#FFFFFF" stroke-width="2"/>
<line x1="216" y1="85" x2="222" y2="93" stroke="#FFFFFF" stroke-width="2"/>
<!-- Wind arrow -->
<text x="145" y="68" font-family="monospace" font-size="10" fill="#FF8800">wind→any dir</text>

<!-- LEAN-TO (middle, y=95-168) -->
<text x="14" y="108" font-family="monospace" font-size="11" fill="#00FFFF">LEAN-TO</text>
<!-- Tree/pole at back -->
<rect x="30" y="107" width="6" height="56" rx="2" fill="#664422"/>
<!-- Tarp angled forward -->
<line x1="36" y1="115" x2="200" y2="115" stroke="#FFFF00" stroke-width="2" stroke-dasharray="5,3"/>
<line x1="36" y1="115" x2="20" y2="160" stroke="#00FFFF" stroke-width="2"/>
<line x1="200" y1="115" x2="216" y2="160" stroke="#00FFFF" stroke-width="2"/>
<line x1="20" y1="160" x2="216" y2="160" stroke="#555" stroke-width="1"/>
<polygon points="36,115 200,115 216,160 20,160" fill="#00FFFF" fill-opacity="0.12"/>
<!-- Stakes at front -->
<line x1="20" y1="160" x2="14" y2="166" stroke="#FFFFFF" stroke-width="2"/>
<line x1="216" y1="160" x2="222" y2="166" stroke="#FFFFFF" stroke-width="2"/>
<!-- Wind arrow from open side -->
<text x="120" y="145" font-family="monospace" font-size="10" fill="#FF8800" text-anchor="middle">back to wind →</text>

<!-- BURRITO WRAP (bottom, y=168-240) -->
<text x="14" y="180" font-family="monospace" font-size="11" fill="#00FFFF">BURRITO WRAP</text>
<!-- Person outline horizontal -->
<ellipse cx="120" cy="205" rx="80" ry="14" fill="#00FFFF" fill-opacity="0.15" stroke="#00FFFF" stroke-width="2"/>
<!-- Wrapped edges -->
<line x1="42" y1="192" x2="42" y2="218" stroke="#00FFFF" stroke-width="2"/>
<line x1="198" y1="192" x2="198" y2="218" stroke="#00FFFF" stroke-width="2"/>
<!-- Person head circle -->
<circle cx="50" cy="205" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<!-- Roll arrows -->
<text x="120" y="200" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">roll tarp under body</text>
<text x="120" y="216" font-family="monospace" font-size="10" fill="#FF8800" text-anchor="middle">emergency warmth only</text>
<text x="120" y="232" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="middle">lay on folded edge side</text>
</svg>
