<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">RULE OF 3s</text>

<!-- Priority pyramid — 5 tiers from top (most urgent) to bottom (least urgent) -->
<!-- Tier 1: 3 seconds - PANIC - tiny peak at top -->
<polygon points="120,22 100,48 140,48" fill="#FF4444"/>
<text x="120" y="42" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">3 SEC</text>

<!-- Tier 2: 3 minutes - AIRWAY - second tier -->
<polygon points="100,50 140,50 155,78 85,78" fill="#FF4444" fill-opacity="0.85"/>
<text x="120" y="68" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">3 MIN · NO AIR</text>

<!-- Tier 3: 3 hours - SHELTER - third tier -->
<polygon points="85,80 155,80 172,110 68,110" fill="#FF8800" fill-opacity="0.9"/>
<text x="120" y="100" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">3 HRS · NO SHELTER</text>

<!-- Tier 4: 3 days - WATER - fourth tier -->
<polygon points="68,112 172,112 192,145 48,145" fill="#FFFF00" fill-opacity="0.9"/>
<text x="120" y="133" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">3 DAYS · NO WATER</text>

<!-- Tier 5: 3 weeks - FOOD - base tier -->
<polygon points="48,147 192,147 215,183 25,183" fill="#00FF00" fill-opacity="0.85"/>
<text x="120" y="170" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">3 WEEKS · NO FOOD</text>

<!-- Labels on right side with arrows -->
<line x1="140" y1="35" x2="165" y2="35" stroke="#FF4444" stroke-width="1" stroke-dasharray="2,2"/>
<text x="168" y="39" font-family="monospace" font-size="10" fill="#FF4444">PANIC kills</text>

<line x1="155" y1="64" x2="165" y2="64" stroke="#FF4444" stroke-width="1" stroke-dasharray="2,2"/>
<text x="168" y="68" font-family="monospace" font-size="10" fill="#FF4444">AIRWAY 1st</text>

<line x1="172" y1="95" x2="182" y2="95" stroke="#FF8800" stroke-width="1" stroke-dasharray="2,2"/>
<text x="184" y="99" font-family="monospace" font-size="10" fill="#FF8800">SHELTER</text>

<line x1="192" y1="129" x2="196" y2="129" stroke="#FFFF00" stroke-width="1" stroke-dasharray="2,2"/>
<text x="198" y="133" font-family="monospace" font-size="10" fill="#FFFF00">WATER</text>

<line x1="215" y1="165" x2="218" y2="165" stroke="#00FF00" stroke-width="1" stroke-dasharray="2,2"/>
<text x="220" y="169" font-family="monospace" font-size="10" fill="#00FF00">FOOD</text>

<!-- Base divider line -->
<line x1="5" y1="190" x2="235" y2="190" stroke="#333" stroke-width="1"/>

<!-- Priority reminder -->
<text x="120" y="205" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">PRIORITIES: top = most urgent</text>
<text x="120" y="220" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">Stay calm · Think → Act</text>
<text x="120" y="235" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Signal · Shelter · Water · Fire</text>
</svg>
