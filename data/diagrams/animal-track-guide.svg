<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">ANIMAL TRACKS</text>

<!-- Scale bar bottom -->
<line x1="10" y1="228" x2="60" y2="228" stroke="#FFFFFF" stroke-width="2"/>
<line x1="10" y1="224" x2="10" y2="232" stroke="#FFFFFF" stroke-width="2"/>
<line x1="60" y1="224" x2="60" y2="232" stroke="#FFFFFF" stroke-width="2"/>
<text x="35" y="222" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">10cm</text>

<!-- DEER (top-left) ~cx=45, cy=55 -->
<text x="45" y="28" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">DEER</text>
<!-- Two-toed hoof shape -->
<ellipse cx="39" cy="50" rx="7" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<ellipse cx="51" cy="50" rx="7" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<line x1="39" y1="38" x2="51" y2="38" stroke="#555" stroke-width="1"/>

<!-- RABBIT (top-center) ~cx=120, cy=55 -->
<text x="120" y="28" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">RABBIT</text>
<!-- 4 small front dots + 2 big rear ovals -->
<circle cx="112" cy="65" r="3" fill="#FFFFFF"/>
<circle cx="120" cy="65" r="3" fill="#FFFFFF"/>
<circle cx="128" cy="65" r="3" fill="#FFFFFF"/>
<circle cx="116" cy="57" r="3" fill="#FFFFFF"/>
<!-- Big hind pads -->
<ellipse cx="110" cy="47" rx="5" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<ellipse cx="130" cy="47" rx="5" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>

<!-- RACCOON (top-right) ~cx=195, cy=55 -->
<text x="195" y="28" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">RACCOON</text>
<!-- Hand-like: 5 finger-tip circles around main pad -->
<ellipse cx="195" cy="57" rx="9" ry="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="185" cy="47" r="3" fill="#FFFFFF"/>
<circle cx="191" cy="44" r="3" fill="#FFFFFF"/>
<circle cx="198" cy="43" r="3" fill="#FFFFFF"/>
<circle cx="204" cy="46" r="3" fill="#FFFFFF"/>
<circle cx="208" cy="52" r="3" fill="#FFFFFF"/>

<!-- Divider -->
<line x1="5" y1="88" x2="235" y2="88" stroke="#333" stroke-width="1"/>

<!-- COYOTE (bottom-left) ~cx=45, cy=155 -->
<text x="45" y="103" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">COYOTE</text>
<!-- Oval main pad + 4 toe ovals -->
<ellipse cx="45" cy="140" rx="10" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<ellipse cx="34" cy="127" rx="5" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<ellipse cx="44" cy="124" rx="5" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<ellipse cx="54" cy="125" rx="5" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<ellipse cx="60" cy="133" rx="5" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

<!-- BEAR (bottom-center) ~cx=120, cy=155 -->
<text x="120" y="103" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">BEAR</text>
<!-- Wide pad + 5 toes (big) -->
<ellipse cx="120" cy="150" rx="16" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="100" cy="133" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="110" cy="128" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="121" cy="127" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="132" cy="130" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="139" cy="138" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>

<!-- TURKEY (bottom-right) ~cx=195, cy=155 -->
<text x="195" y="103" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">TURKEY</text>
<!-- 3 forward toes + 1 back toe -->
<line x1="195" y1="155" x2="195" y2="125" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<line x1="195" y1="155" x2="175" y2="138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<line x1="195" y1="155" x2="215" y2="138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<line x1="195" y1="155" x2="195" y2="165" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<!-- Toe tip dots -->
<circle cx="195" cy="125" r="3" fill="#FFFFFF"/>
<circle cx="175" cy="138" r="3" fill="#FFFFFF"/>
<circle cx="215" cy="138" r="3" fill="#FFFFFF"/>

<!-- Size indicator -->
<text x="80" y="222" font-family="monospace" font-size="10" fill="#555">S</text>
<text x="120" y="222" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">BEAR=LARGE</text>
<text x="165" y="222" font-family="monospace" font-size="10" fill="#555">L</text>
</svg>
