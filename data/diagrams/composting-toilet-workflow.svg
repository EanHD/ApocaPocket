<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <rect width="240" height="240" fill="black"/>
  <!-- Title -->
  <text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle" font-weight="bold">COMPOSTING TOILET</text>

  <!-- Cross-section chamber -->
  <!-- Seat/top -->
  <rect x="70" y="22" width="100" height="10" rx="3" fill="#888" stroke="#FFFFFF" stroke-width="1"/>
  <text x="120" y="30" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">SEAT</text>

  <!-- Chamber walls -->
  <rect x="75" y="32" width="90" height="55" fill="#3a2a1a" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Chamber label -->
  <text x="120" y="48" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">USE CHAMBER</text>
  <!-- Cover material arrow -->
  <line x1="60" y1="50" x2="78" y2="50" stroke="#00FF00" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="57" y="48" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="end">+Cover</text>
  <text x="57" y="58" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="end">material</text>

  <!-- Drain arrow -->
  <line x1="120" y1="87" x2="120" y2="100" stroke="#00FFFF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Liquid drain chamber -->
  <rect x="95" y="100" width="50" height="20" fill="#1a1a3a" stroke="#00FFFF" stroke-width="1"/>
  <text x="120" y="114" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">LIQUID DRAIN</text>

  <!-- Decompose pit -->
  <rect x="75" y="125" width="90" height="35" fill="#2a1a0a" stroke="#FF8C00" stroke-width="1.5"/>
  <text x="120" y="139" font-family="monospace" font-size="10" fill="#FF8C00" text-anchor="middle">DECOMPOSE PIT</text>
  <text x="120" y="152" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">6-12 MONTHS</text>

  <!-- Ground line -->
  <line x1="40" y1="163" x2="200" y2="163" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="42" y="172" font-family="monospace" font-size="10" fill="#888">ground</text>

  <!-- Step list -->
  <text x="12" y="183" font-family="monospace" font-size="10" fill="#FFFF00">WORKFLOW:</text>
  <text x="12" y="196" font-family="monospace" font-size="10" fill="#00FF00">1. Use seat</text>
  <text x="12" y="208" font-family="monospace" font-size="10" fill="#00FF00">2. Add cover material</text>
  <text x="12" y="220" font-family="monospace" font-size="10" fill="#00FFFF">3. Drain liquid away</text>
  <text x="12" y="232" font-family="monospace" font-size="10" fill="#FF8C00">4. Compost 6-12 mo.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FFFFFF"/>
    </marker>
  </defs>
</svg>
