<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <rect width="240" height="240" fill="black"/>
  <text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle" font-weight="bold">SNOW MELT RATIO</text>
  <text x="120" y="26" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Snow volume → Water yield</text>

  <!-- Fire icon (simple) -->
  <text x="20" y="50" font-family="monospace" font-size="18" fill="#FF4444">🔥</text>
  <text x="45" y="50" font-family="monospace" font-size="11" fill="#FFFF00">HEAT SOURCE</text>

  <!-- Bar chart area -->
  <!-- Loose Snow -->
  <text x="10" y="72" font-family="monospace" font-size="10" fill="#FFFFFF">Loose Snow</text>
  <rect x="110" y="60" width="120" height="14" fill="#1a3a5a" stroke="#444" stroke-width="1"/>
  <rect x="110" y="60" width="120" height="14" fill="#3399FF"/>
  <text x="115" y="71" font-family="monospace" font-size="10" fill="#FFFFFF">10:1 ratio</text>

  <!-- Packed Snow -->
  <text x="10" y="95" font-family="monospace" font-size="10" fill="#FFFFFF">Packed Snow</text>
  <rect x="110" y="83" width="120" height="14" fill="#1a3a5a" stroke="#444" stroke-width="1"/>
  <rect x="110" y="83" width="60" height="14" fill="#00AAFF"/>
  <text x="115" y="94" font-family="monospace" font-size="10" fill="#FFFFFF">5:1 ratio</text>

  <!-- Ice -->
  <text x="10" y="118" font-family="monospace" font-size="10" fill="#FFFFFF">Ice</text>
  <rect x="110" y="106" width="120" height="14" fill="#1a3a5a" stroke="#444" stroke-width="1"/>
  <rect x="110" y="106" width="13" height="14" fill="#00FFFF"/>
  <text x="115" y="117" font-family="monospace" font-size="10" fill="#FFFFFF">1.1:1 ratio</text>

  <!-- Scale labels -->
  <text x="110" y="133" font-family="monospace" font-size="10" fill="#888">0</text>
  <text x="224" y="133" font-family="monospace" font-size="10" fill="#888">10x</text>

  <!-- Divider -->
  <line x1="10" y1="140" x2="230" y2="140" stroke="#FFFF00" stroke-width="1"/>

  <!-- Tips -->
  <text x="12" y="154" font-family="monospace" font-size="10" fill="#FFFF00">TIPS:</text>
  <text x="12" y="167" font-family="monospace" font-size="10" fill="#00FF00">Pack snow tightly</text>
  <text x="12" y="180" font-family="monospace" font-size="10" fill="#00FF00">before melting</text>
  <text x="12" y="193" font-family="monospace" font-size="10" fill="#00FFFF">Use wide shallow pot</text>
  <text x="12" y="206" font-family="monospace" font-size="10" fill="#00FFFF">Add water first</text>

  <!-- Warning box -->
  <rect x="10" y="216" width="220" height="20" rx="3" fill="#3a0000" stroke="#FF4444" stroke-width="1.5"/>
  <text x="120" y="230" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle" font-weight="bold">⚠ ALWAYS MELT BEFORE DRINKING</text>
</svg>
