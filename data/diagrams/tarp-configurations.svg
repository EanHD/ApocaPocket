<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">TARP SHELTERS</text>

<!-- Row 1 labels -->
<line x1="2" y1="16" x2="238" y2="16" stroke="#FFFFFF" stroke-width="0.3"/>

<!-- === A-FRAME === -->
<rect x="2" y="18" width="76" height="88" fill="#00FFFF" fill-opacity="0.06" stroke="#00FFFF" stroke-width="0.5"/>
<text x="40" y="27" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">A-FRAME</text>
<!-- ridgeline -->
<line x1="10" y1="52" x2="70" y2="52" stroke="#FFFF00" stroke-width="1" stroke-dasharray="2,2"/>
<!-- tarp sides -->
<line x1="10" y1="52" x2="10" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="10" y1="52" x2="40" y2="35" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="40" y1="35" x2="70" y2="52" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="70" y1="52" x2="70" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="10" y1="80" x2="70" y2="80" stroke="#00FFFF" stroke-width="1"/>
<!-- fill -->
<polygon points="10,52 40,35 70,52 70,80 10,80" fill="#00FFFF" fill-opacity="0.1"/>
<text x="40" y="88" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">Rain+Wind ★★★</text>
<text x="40" y="96" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Setup: ★★☆</text>
<text x="40" y="103" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">2 trees, ridgeline</text>

<!-- === LEAN-TO === -->
<rect x="82" y="18" width="76" height="88" fill="#00FFFF" fill-opacity="0.06" stroke="#00FFFF" stroke-width="0.5"/>
<text x="120" y="27" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">LEAN-TO</text>
<!-- high line -->
<line x1="90" y1="38" x2="150" y2="38" stroke="#FFFF00" stroke-width="1" stroke-dasharray="2,2"/>
<!-- tarp slope -->
<polygon points="90,38 150,38 150,80 90,80" fill="#00FFFF" fill-opacity="0.15"/>
<line x1="90" y1="38" x2="90" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="150" y1="38" x2="150" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="90" y1="80" x2="150" y2="80" stroke="#00FFFF" stroke-width="1"/>
<!-- support poles -->
<line x1="95" y1="38" x2="95" y2="82" stroke="#FFFFFF" stroke-width="0.8"/>
<line x1="145" y1="38" x2="145" y2="82" stroke="#FFFFFF" stroke-width="0.8"/>
<text x="120" y="88" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">Wind block ★★★</text>
<text x="120" y="96" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Setup: ★☆☆</text>
<text x="120" y="103" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Easiest, fast build</text>

<!-- === PLOW POINT === -->
<rect x="162" y="18" width="76" height="88" fill="#00FFFF" fill-opacity="0.06" stroke="#00FFFF" stroke-width="0.5"/>
<text x="200" y="27" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">PLOW POINT</text>
<!-- arrow/wedge shape from front -->
<polygon points="200,35 170,80 230,80" fill="#00FFFF" fill-opacity="0.15"/>
<line x1="200" y1="35" x2="170" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="200" y1="35" x2="230" y2="80" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="170" y1="80" x2="230" y2="80" stroke="#00FFFF" stroke-width="1"/>
<!-- apex stake -->
<line x1="200" y1="35" x2="200" y2="20" stroke="#FFFF00" stroke-width="1" stroke-dasharray="2,1"/>
<text x="200" y="88" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">Wind ★★★★</text>
<text x="200" y="96" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Setup: ★★☆</text>
<text x="200" y="103" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Point into wind</text>

<!-- Divider -->
<line x1="2" y1="108" x2="238" y2="108" stroke="#FFFFFF" stroke-width="0.3"/>

<!-- Row 2 -->

<!-- === WEDGE/DIAMOND === -->
<rect x="2" y="110" width="116" height="90" fill="#00FFFF" fill-opacity="0.06" stroke="#00FFFF" stroke-width="0.5"/>
<text x="60" y="120" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">WEDGE/DIAMOND</text>
<!-- diamond layout overhead view -->
<polygon points="60,128 30,160 60,190 90,160" fill="#00FFFF" fill-opacity="0.15"/>
<line x1="60" y1="128" x2="30" y2="160" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="30" y1="160" x2="60" y2="190" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="60" y1="190" x2="90" y2="160" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="90" y1="160" x2="60" y2="128" stroke="#00FFFF" stroke-width="1.5"/>
<!-- ridgeline -->
<line x1="60" y1="128" x2="60" y2="190" stroke="#FFFF00" stroke-width="0.8" stroke-dasharray="2,1"/>
<text x="60" y="199" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">All-weather ★★★</text>
<text x="60" y="207" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Setup: ★★★</text>

<!-- === RIDGELINE/BURRITO === -->
<rect x="122" y="110" width="116" height="90" fill="#00FFFF" fill-opacity="0.06" stroke="#00FFFF" stroke-width="0.5"/>
<text x="180" y="120" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">BURRITO WRAP</text>
<!-- burrito: tube shape -->
<rect x="140" y="135" width="80" height="40" rx="8" fill="#00FFFF" fill-opacity="0.15" stroke="#00FFFF" stroke-width="1.5"/>
<line x1="180" y1="135" x2="180" y2="175" stroke="#FFFF00" stroke-width="0.8" stroke-dasharray="2,1"/>
<!-- person inside indicator -->
<ellipse cx="180" cy="145" rx="8" ry="6" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="180" y="148" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">you</text>
<text x="180" y="185" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">Cold/wet ★★★★</text>
<text x="180" y="193" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Setup: ★☆☆</text>
<text x="180" y="201" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Wrap around self</text>

<!-- Bottom note -->
<line x1="2" y1="204" x2="238" y2="204" stroke="#FFFF00" stroke-width="0.5"/>
<text x="120" y="213" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">★=Difficulty  Face open side AWAY from wind</text>
<text x="120" y="223" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Angle roof 30°+ for rain runoff. Stake corners.</text>
<text x="120" y="234" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Lean-to = fastest build in emergency</text>
</svg>
