<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">SIGNAL MIRROR</text>
<!-- Sun top right -->
<circle cx="210" cy="40" r="14" fill="#FFFF00" fill-opacity="0.9"/>
<line x1="210" y1="18" x2="210" y2="10" stroke="#FFFF00" stroke-width="2"/>
<line x1="228" y1="40" x2="236" y2="40" stroke="#FFFF00" stroke-width="2"/>
<line x1="222" y1="22" x2="228" y2="16" stroke="#FFFF00" stroke-width="2"/>
<line x1="222" y1="58" x2="228" y2="64" stroke="#FFFF00" stroke-width="2"/>
<text x="210" y="30" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">SUN</text>
<!-- Target aircraft top left -->
<polygon points="30,30 50,35 30,40" fill="#00FFFF" stroke="#00FFFF" stroke-width="1"/>
<polygon points="30,35 22,28 22,42" fill="#00FFFF"/>
<text x="36" y="52" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">TARGET</text>
<!-- Person holding mirror - center -->
<!-- Body stick figure -->
<circle cx="100" cy="95" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<line x1="100" y1="103" x2="100" y2="140" stroke="#FFFFFF" stroke-width="2"/>
<line x1="100" y1="115" x2="75" y2="130" stroke="#FFFFFF" stroke-width="2"/>
<line x1="100" y1="115" x2="125" y2="105" stroke="#FFFFFF" stroke-width="2"/>
<line x1="100" y1="140" x2="85" y2="160" stroke="#FFFFFF" stroke-width="2"/>
<line x1="100" y1="140" x2="115" y2="160" stroke="#FFFFFF" stroke-width="2"/>
<!-- Mirror in right hand -->
<rect x="122" y="97" width="20" height="16" fill="none" stroke="#00FFFF" stroke-width="2" rx="1"/>
<text x="132" y="108" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">M</text>
<!-- V-sight hand -->
<line x1="75" y1="130" x2="60" y2="118" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,2"/>
<!-- Reflection beam: sun → mirror → target -->
<line x1="200" y1="44" x2="132" y2="105" stroke="#FFFF00" stroke-width="1" stroke-dasharray="5,3"/>
<line x1="132" y1="97" x2="40" y2="38" stroke="#FFFF00" stroke-width="2"/>
<!-- V-sight detail -->
<text x="55" y="116" font-family="monospace" font-size="10" fill="#FF8800">V</text>
<!-- Labels -->
<text x="120" y="175" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">1. Hold mirror · aim sun</text>
<text x="120" y="190" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">2. V-sight thru hole at target</text>
<text x="120" y="205" font-family="monospace" font-size="10" fill="#00FF00" text-anchor="middle">3×flash = DISTRESS signal</text>
<text x="120" y="220" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Range: up to 16km clear day</text>
</svg>
