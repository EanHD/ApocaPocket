<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">IMPROVISED SPLINT</text>
<!-- Three sections -->
<!-- ARM SPLINT (left column) -->
<text x="40" y="30" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">ARM</text>
<!-- Forearm with board below -->
<rect x="12" y="38" width="56" height="12" rx="4" fill="#FF8800" fill-opacity="0.6"/>
<rect x="10" y="52" width="60" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.5"/>
<!-- Ties -->
<line x1="22" y1="36" x2="22" y2="62" stroke="#FFFF00" stroke-width="2"/>
<line x1="56" y1="36" x2="56" y2="62" stroke="#FFFF00" stroke-width="2"/>
<!-- Sling line -->
<path d="M10,50 Q40,80 70,50" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,2"/>
<text x="40" y="88" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Board+sling</text>
<!-- LEG SPLINT (center column) -->
<text x="120" y="30" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">LEG</text>
<!-- Two legs side by side -->
<rect x="100" y="38" width="16" height="48" rx="4" fill="#FF8800" fill-opacity="0.6"/>
<rect x="124" y="38" width="16" height="48" rx="4" fill="#FF8800" fill-opacity="0.4"/>
<!-- Padding between -->
<rect x="116" y="44" width="8" height="36" fill="#FFFFFF" fill-opacity="0.3" rx="2"/>
<!-- Ties -->
<line x1="98" y1="50" x2="142" y2="50" stroke="#FFFF00" stroke-width="2"/>
<line x1="98" y1="70" x2="142" y2="70" stroke="#FFFF00" stroke-width="2"/>
<text x="120" y="98" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Pad+tie legs</text>
<!-- WRIST SPLINT (right column) -->
<text x="200" y="30" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">WRIST</text>
<!-- Hand/wrist with board -->
<rect x="175" y="38" width="50" height="24" rx="4" fill="#FF8800" fill-opacity="0.6"/>
<rect x="173" y="64" width="54" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.5"/>
<!-- Padding fill -->
<rect x="175" y="38" width="50" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
<!-- Ties -->
<line x1="185" y1="36" x2="185" y2="74" stroke="#FFFF00" stroke-width="2"/>
<line x1="213" y1="36" x2="213" y2="74" stroke="#FFFF00" stroke-width="2"/>
<text x="200" y="88" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Padded board</text>
<!-- Divider line -->
<line x1="5" y1="104" x2="235" y2="104" stroke="#444" stroke-width="1"/>
<!-- Rules section -->
<text x="120" y="118" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">RULES</text>
<text x="6" y="133" font-family="monospace" font-size="10" fill="#FFFFFF">✓ Immobilize joint ABOVE+BELOW</text>
<text x="6" y="149" font-family="monospace" font-size="10" fill="#00FF00">✓ Check pulse/warmth after</text>
<text x="6" y="165" font-family="monospace" font-size="10" fill="#FF4444">✗ Never straighten compound</text>
<text x="6" y="181" font-family="monospace" font-size="10" fill="#FF4444">✗ Never splint if it moves bone</text>
<text x="6" y="197" font-family="monospace" font-size="10" fill="#00FFFF">Pad all hard surfaces well</text>
</svg>
