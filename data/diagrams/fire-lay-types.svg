<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">FIRE LAYS</text>
<!-- Grid dividers -->
<line x1="120" y1="18" x2="120" y2="240" stroke="#333" stroke-width="1"/>
<line x1="0" y1="130" x2="240" y2="130" stroke="#333" stroke-width="1"/>

<!-- TEEPEE (top-left, center ~60,74) -->
<text x="60" y="28" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">TEEPEE</text>
<!-- Tinder bundle center -->
<circle cx="60" cy="80" r="5" fill="#FF8800"/>
<!-- Sticks radiating outward -->
<line x1="60" y1="75" x2="50" y2="40" stroke="#FF8800" stroke-width="3"/>
<line x1="60" y1="75" x2="65" y2="38" stroke="#FF8800" stroke-width="3"/>
<line x1="60" y1="75" x2="77" y2="45" stroke="#FF8800" stroke-width="3"/>
<line x1="60" y1="75" x2="80" y2="65" stroke="#FF8800" stroke-width="2.5"/>
<line x1="60" y1="75" x2="75" y2="85" stroke="#FF8800" stroke-width="2.5"/>
<line x1="60" y1="75" x2="45" y2="88" stroke="#FF8800" stroke-width="2.5"/>
<line x1="60" y1="75" x2="38" y2="68" stroke="#FF8800" stroke-width="2.5"/>
<line x1="60" y1="75" x2="42" y2="52" stroke="#FF8800" stroke-width="3"/>
<text x="60" y="112" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Fast boil</text>

<!-- LOG CABIN (top-right, center ~180,74) -->
<text x="180" y="28" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">LOG CABIN</text>
<!-- Nested square logs -->
<rect x="160" y="42" width="40" height="8" rx="2" fill="#FF8800" fill-opacity="0.9"/>
<rect x="160" y="86" width="40" height="8" rx="2" fill="#FF8800" fill-opacity="0.9"/>
<rect x="156" y="50" width="8" height="44" rx="2" fill="#FF8800" fill-opacity="0.8"/>
<rect x="196" y="50" width="8" height="44" rx="2" fill="#FF8800" fill-opacity="0.8"/>
<rect x="164" y="52" width="32" height="6" rx="1" fill="#FF8800" fill-opacity="0.7"/>
<rect x="164" y="78" width="32" height="6" rx="1" fill="#FF8800" fill-opacity="0.7"/>
<rect x="162" y="58" width="6" height="20" rx="1" fill="#FF8800" fill-opacity="0.6"/>
<rect x="192" y="58" width="6" height="20" rx="1" fill="#FF8800" fill-opacity="0.6"/>
<!-- tinder center -->
<circle cx="180" cy="68" r="4" fill="#FFFF00"/>
<text x="180" y="112" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Long burn</text>

<!-- STAR FIRE (bottom-left, center ~60,185) -->
<text x="60" y="143" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">STAR FIRE</text>
<!-- Center ember -->
<circle cx="60" cy="185" r="6" fill="#FF4444"/>
<!-- 5 logs pointing inward like star -->
<line x1="60" y1="179" x2="60" y2="152" stroke="#FF8800" stroke-width="5"/>
<line x1="65" y1="182" x2="86" y2="165" stroke="#FF8800" stroke-width="5"/>
<line x1="63" y1="190" x2="82" y2="207" stroke="#FF8800" stroke-width="5"/>
<line x1="55" y1="190" x2="38" y2="207" stroke="#FF8800" stroke-width="5"/>
<line x1="55" y1="182" x2="34" y2="165" stroke="#FF8800" stroke-width="5"/>
<text x="60" y="225" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Feed in logs</text>

<!-- KEYHOLE (bottom-right, center ~180,185) -->
<text x="180" y="143" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="middle">KEYHOLE</text>
<!-- Keyhole shape: circle + channel -->
<circle cx="175" cy="170" r="16" fill="none" stroke="#FF8800" stroke-width="3"/>
<!-- Stones outline -->
<ellipse cx="175" cy="170" rx="16" ry="16" fill="none" stroke="#555" stroke-width="5" stroke-dasharray="2,1"/>
<!-- Channel for coals -->
<rect x="185" y="168" width="28" height="12" rx="2" fill="none" stroke="#FF8800" stroke-width="2"/>
<!-- Coals in channel -->
<circle cx="193" cy="174" r="3" fill="#FF4444" fill-opacity="0.7"/>
<circle cx="202" cy="172" r="3" fill="#FF4444" fill-opacity="0.7"/>
<circle cx="208" cy="175" r="2" fill="#FF4444" fill-opacity="0.5"/>
<text x="192" y="155" font-family="monospace" font-size="10" fill="#FFFFFF">←coals</text>
<text x="180" y="225" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Cooking</text>
</svg>
