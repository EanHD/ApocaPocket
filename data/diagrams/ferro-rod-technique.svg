<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">FERRO ROD TECHNIQUE</text>

<!-- Left: Grip diagram -->
<text x="6" y="25" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">GRIP</text>
<!-- Hand block -->
<rect x="5" y="28" width="22" height="30" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1"/>
<text x="16" y="47" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">hand</text>
<!-- Rod at 30 degrees -->
<line x1="27" y1="42" x2="68" y2="75" stroke="#00FFFF" stroke-width="3"/>
<!-- Angle label -->
<path d="M 35,42 A 12,12 0 0,1 42,55" fill="none" stroke="#FFFF00" stroke-width="1"/>
<text x="46" y="48" fill="#FFFF00" font-size="10.0" font-family="monospace">30°</text>
<!-- Scraper -->
<rect x="60" y="72" width="18" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="1"/>
<text x="69" y="78" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">scraper</text>
<text x="16" y="65" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">rod</text>

<!-- Center: Spark direction -->
<text x="120" y="25" fill="#FFFF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">SPARKS → TINDER</text>
<!-- Rod body center -->
<line x1="90" y1="60" x2="150" y2="60" stroke="#00FFFF" stroke-width="3"/>
<text x="120" y="55" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">ferro rod</text>
<!-- Sparks flying right -->
<line x1="148" y1="60" x2="165" y2="50" stroke="#FF4444" stroke-width="1"/>
<polygon points="165,50 158,52 161,58" fill="#FF4444"/>
<line x1="148" y1="60" x2="168" y2="60" stroke="#FF4444" stroke-width="1"/>
<polygon points="168,60 161,57 161,63" fill="#FF4444"/>
<line x1="148" y1="60" x2="165" y2="70" stroke="#FF4444" stroke-width="1"/>
<polygon points="165,70 158,68 161,62" fill="#FF4444"/>
<line x1="148" y1="60" x2="162" y2="45" stroke="#FF4444" stroke-width="0.8"/>
<line x1="148" y1="60" x2="163" y2="75" stroke="#FF4444" stroke-width="0.8"/>
<text x="185" y="58" fill="#FF4444" font-size="10.0" font-family="monospace">3000°F</text>
<text x="185" y="66" fill="#FF4444" font-size="10.0" font-family="monospace">sparks</text>

<!-- Tinder nest -->
<ellipse cx="185" cy="82" rx="18" ry="9" fill="#8B4513" fill-opacity="0.4" stroke="#00FF00" stroke-width="1"/>
<text x="185" y="86" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">TINDER</text>
<!-- Arrow from sparks to tinder -->
<line x1="175" y1="68" x2="182" y2="74" stroke="#FF4444" stroke-width="1"/>
<polygon points="182,74 176,71 179,77" fill="#FF4444"/>

<!-- Steps -->
<rect x="3" y="98" width="150" height="72" fill="#00FFFF" fill-opacity="0.08" stroke="#00FFFF" stroke-width="0.5"/>
<text x="6" y="108" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">TECHNIQUE:</text>
<text x="6" y="118" fill="#FFFFFF" font-size="10.0" font-family="monospace">1) Rod at 30° angle</text>
<text x="6" y="127" fill="#FFFFFF" font-size="10.0" font-family="monospace">2) Scraper stationary</text>
<text x="6" y="136" fill="#FFFFFF" font-size="10.0" font-family="monospace">3) PUSH rod forward</text>
<text x="6" y="145" fill="#00FF00" font-size="10.0" font-family="monospace">   (not scraper back)</text>
<text x="6" y="154" fill="#FFFFFF" font-size="10.0" font-family="monospace">4) Strike into tinder</text>
<text x="6" y="163" fill="#FF4444" font-size="10.0" font-family="monospace">5) DO NOT blow early</text>

<!-- Tinder types -->
<rect x="157" y="98" width="80" height="72" fill="#00FF00" fill-opacity="0.08" stroke="#00FF00" stroke-width="0.5"/>
<text x="197" y="108" fill="#FFFF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">TINDER:</text>
<text x="160" y="118" fill="#00FF00" font-size="10.0" font-family="monospace">✓ Dry grass</text>
<text x="160" y="127" fill="#00FF00" font-size="10.0" font-family="monospace">✓ Cattail fluff</text>
<text x="160" y="136" fill="#00FF00" font-size="10.0" font-family="monospace">✓ Birch bark</text>
<text x="160" y="145" fill="#00FF00" font-size="10.0" font-family="monospace">✓ Cedar bark</text>
<text x="160" y="154" fill="#00FF00" font-size="10.0" font-family="monospace">✓ Fatwood dust</text>
<text x="160" y="163" fill="#FF4444" font-size="10.0" font-family="monospace">✗ Damp/green</text>

<!-- Common mistakes -->
<rect x="3" y="175" width="234" height="30" fill="#FF4444" fill-opacity="0.12" stroke="#FF4444" stroke-width="1"/>
<text x="120" y="185" fill="#FF4444" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">COMMON MISTAKES:</text>
<text x="120" y="196" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Don't blow too early · Hold rod low near tinder · Keep angle consistent</text>

<!-- Temperature banner -->
<text x="120" y="215" fill="#FF4444" font-size="11.2" font-weight="bold" text-anchor="middle" font-family="monospace">SPARK TEMP: 3000°F</text>
<text x="120" y="228" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Ignites almost any dry tinder instantly</text>
</svg>
