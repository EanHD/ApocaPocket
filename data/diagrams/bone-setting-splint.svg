<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">FIELD SPLINTING</text>

<!-- When to splint section -->
<rect x="2" y="16" width="236" height="22" fill="#1A0000" stroke="#FF4444" stroke-width="1" rx="2"/>
<text x="120" y="25" fill="#FF4444" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">WHEN TO SPLINT</text>
<text x="8" y="34" fill="#FFFFFF" font-size="10.0" font-family="monospace">Suspected fracture (deformity,pain on pressure) | Dislocations</text>

<!-- Splint construction diagram -->
<text x="120" y="47" fill="#FFFF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">SPLINT LAYERS (cross-section)</text>

<!-- Cross section view of limb with splint -->
<!-- Skin/limb (inner) -->
<ellipse cx="80" cy="68" rx="20" ry="12" fill="#441100" stroke="#FFFFFF" stroke-width="1"/>
<text x="80" y="70" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">LIMB</text>
<!-- Padding layer -->
<ellipse cx="80" cy="68" rx="28" ry="18" fill="none" stroke="#FFFF00" stroke-width="2" stroke-dasharray="3,2"/>
<text x="80" y="92" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">PADDING (cloth)</text>
<!-- Rigid layer -->
<rect x="44" y="52" width="72" height="32" fill="none" stroke="#00FFFF" stroke-width="2" rx="2"/>
<text x="80" y="100" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">RIGID (sticks/card)</text>

<!-- Layer labels with arrows -->
<line x1="110" y1="68" x2="128" y2="62" stroke="#FFFFFF" stroke-width="0.7"/>
<text x="130" y="61" fill="#FFFFFF" font-size="10.0" font-family="monospace">1. Padding on skin</text>
<line x1="110" y1="68" x2="128" y2="72" stroke="#FFFF00" stroke-width="0.7"/>
<text x="130" y="71" fill="#FFFF00" font-size="10.0" font-family="monospace">2. Rigid outside</text>
<text x="130" y="79" fill="#00FFFF" font-size="10.0" font-family="monospace">3. Tie above+below</text>
<text x="130" y="87" fill="#00FF00" font-size="10.0" font-family="monospace">4. 2-finger snug</text>

<!-- Tie rule -->
<line x1="2" y1="107" x2="238" y2="107" stroke="#444444" stroke-width="0.7"/>
<text x="120" y="115" fill="#FFFF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">TIE AT INTERVALS — ABOVE and BELOW break</text>

<!-- Types section -->
<text x="4" y="126" fill="#00FFFF" font-size="10.0" font-weight="bold" font-family="monospace">SPLINT TYPES:</text>

<!-- Arm/sling -->
<text x="4" y="136" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">ARM:</text>
<text x="30" y="136" fill="#FFFFFF" font-size="10.0" font-family="monospace">Splint forearm + sling from neck</text>
<!-- Simple arm sling diagram -->
<line x1="4" y1="140" x2="30" y2="148" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="30" y1="148" x2="50" y2="140" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="4" y1="140" x2="50" y2="140" stroke="#FFFF00" stroke-width="1"/>
<text x="27" y="158" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">sling</text>

<!-- Leg -->
<text x="60" y="136" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">LEG:</text>
<text x="84" y="136" fill="#FFFFFF" font-size="10.0" font-family="monospace">2 sticks outside, 3 tie pts</text>
<!-- Leg diagram -->
<rect x="62" y="140" width="8" height="28" fill="#221100" stroke="#FFFFFF" stroke-width="1"/>
<line x1="60" y1="140" x2="60" y2="168" stroke="#00FFFF" stroke-width="2"/>
<line x1="72" y1="140" x2="72" y2="168" stroke="#00FFFF" stroke-width="2"/>
<line x1="57" y1="145" x2="75" y2="145" stroke="#FFFF00" stroke-width="1.5"/>
<line x1="57" y1="154" x2="75" y2="154" stroke="#FFFF00" stroke-width="1.5"/>
<line x1="57" y1="163" x2="75" y2="163" stroke="#FFFF00" stroke-width="1.5"/>

<!-- Finger buddy tape -->
<text x="120" y="136" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">FINGER:</text>
<text x="160" y="136" fill="#FFFFFF" font-size="10.0" font-family="monospace">Buddy tape</text>
<rect x="122" y="140" width="7" height="22" fill="#221100" stroke="#FFFFFF" stroke-width="1" rx="1"/>
<rect x="131" y="140" width="7" height="22" fill="#221100" stroke="#00FFFF" stroke-width="1" rx="1"/>
<line x1="120" y1="147" x2="141" y2="147" stroke="#FFFF00" stroke-width="2"/>
<line x1="120" y1="154" x2="141" y2="154" stroke="#FFFF00" stroke-width="2"/>
<text x="131" y="170" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">tape together</text>

<!-- Check after splinting -->
<line x1="2" y1="178" x2="238" y2="178" stroke="#FFFF00" stroke-width="1"/>
<rect x="2" y="179" width="236" height="30" fill="#001100" stroke="#00FF00" stroke-width="1" rx="2"/>
<text x="120" y="188" fill="#00FF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">CHECK AFTER SPLINTING (CMS)</text>
<text x="120" y="197" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Color? Warmth? Sensation? Pulse below splint?</text>
<text x="120" y="207" fill="#FF4444" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">No pulse below splint → TOO TIGHT → loosen NOW</text>

<!-- Bottom note -->
<line x1="2" y1="212" x2="238" y2="212" stroke="#444444" stroke-width="0.7"/>
<text x="120" y="221" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Splint in position found — do not realign</text>
<text x="120" y="230" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Immobilize joint above AND below fracture site</text>
</svg>
