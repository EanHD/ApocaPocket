<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <rect width="240" height="240" fill="black"/>
  <text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle" font-weight="bold">WOUND TRIAGE</text>

  <!-- Headers -->
  <text x="10" y="26" font-family="monospace" font-size="10" fill="#FFFF00">TYPE</text>
  <text x="160" y="26" font-family="monospace" font-size="10" fill="#FFFF00">ACTION</text>
  <line x1="8" y1="30" x2="232" y2="30" stroke="#FFFF00" stroke-width="1"/>

  <!-- Row 1: Arterial -->
  <rect x="8" y="32" width="224" height="34" fill="#2a0000"/>
  <text x="14" y="44" font-family="monospace" font-size="10" fill="#FF4444" font-weight="bold">ARTERIAL BLEED</text>
  <text x="14" y="57" font-family="monospace" font-size="10" fill="#FFFFFF">Bright red, spurting</text>
  <text x="160" y="50" font-family="monospace" font-size="10" fill="#FF4444" font-weight="bold">TOURNIQUET</text>

  <!-- Row 2: Venous -->
  <rect x="8" y="67" width="224" height="34" fill="#200000"/>
  <text x="14" y="79" font-family="monospace" font-size="10" fill="#FF8800" font-weight="bold">VENOUS BLEED</text>
  <text x="14" y="92" font-family="monospace" font-size="10" fill="#FFFFFF">Dark red, steady flow</text>
  <text x="160" y="85" font-family="monospace" font-size="10" fill="#FF8800">Pressure 10m</text>

  <!-- Row 3: Puncture -->
  <rect x="8" y="102" width="224" height="34" fill="#181800"/>
  <text x="14" y="114" font-family="monospace" font-size="10" fill="#FFFF00" font-weight="bold">PUNCTURE</text>
  <text x="14" y="127" font-family="monospace" font-size="10" fill="#FFFFFF">Object embedded</text>
  <text x="160" y="114" font-family="monospace" font-size="10" fill="#FFFF00">Don't remove</text>
  <text x="160" y="127" font-family="monospace" font-size="10" fill="#FFFF00">Stabilize it</text>

  <!-- Row 4: Animal bite -->
  <rect x="8" y="137" width="224" height="34" fill="#001a1a"/>
  <text x="14" y="149" font-family="monospace" font-size="10" fill="#00FFFF" font-weight="bold">ANIMAL BITE</text>
  <text x="14" y="162" font-family="monospace" font-size="10" fill="#FFFFFF">Any animal bite</text>
  <text x="160" y="149" font-family="monospace" font-size="10" fill="#00FFFF">Wash 15min</text>
  <text x="160" y="162" font-family="monospace" font-size="10" fill="#00FFFF">running water</text>

  <!-- Row 5: Minor cut -->
  <rect x="8" y="172" width="224" height="34" fill="#001400"/>
  <text x="14" y="184" font-family="monospace" font-size="10" fill="#00FF00" font-weight="bold">MINOR CUT</text>
  <text x="14" y="197" font-family="monospace" font-size="10" fill="#FFFFFF">Small, controlled bleed</text>
  <text x="160" y="184" font-family="monospace" font-size="10" fill="#00FF00">Clean + dress</text>

  <line x1="8" y1="206" x2="232" y2="206" stroke="#444" stroke-width="1"/>
  <line x1="152" y1="30" x2="152" y2="206" stroke="#444" stroke-width="1"/>

  <!-- Footer -->
  <text x="120" y="220" font-family="monospace" font-size="10" fill="#FFFF00" text-anchor="middle">Keep patient WARM + CALM</text>
  <text x="120" y="233" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">Seek medical help ASAP</text>
</svg>
