<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">ESSENTIAL KNOTS</text>
<line x1="0" y1="18" x2="240" y2="18" stroke="#333" stroke-width="1"/>

<!-- BOWLINE (top third, y=20-95) -->
<text x="14" y="32" font-family="monospace" font-size="11" fill="#00FFFF">BOWLINE</text>
<text x="168" y="32" font-family="monospace" font-size="10" fill="#FFFFFF">rescue loop</text>
<!-- Rope path for bowline: rabbit out of hole, around tree, back in hole -->
<path d="M10,65 Q30,50 50,65 Q65,78 80,65 Q95,52 110,55 L140,55 L140,48 L155,55 L140,62 L140,55" fill="none" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<!-- The loop -->
<ellipse cx="40" cy="70" rx="18" ry="12" fill="none" stroke="#FF8800" stroke-width="3"/>
<!-- Arrow showing non-slip -->
<text x="12" y="88" font-family="monospace" font-size="10" fill="#00FF00">↕ loop never slips</text>
<line x1="0" y1="96" x2="240" y2="96" stroke="#333" stroke-width="1"/>

<!-- CLOVE HITCH (middle third, y=97-170) -->
<text x="14" y="110" font-family="monospace" font-size="11" fill="#00FFFF">CLOVE HITCH</text>
<text x="160" y="110" font-family="monospace" font-size="10" fill="#FFFFFF">to pole/tree</text>
<!-- Pole vertical line -->
<rect x="108" y="100" width="10" height="60" rx="2" fill="#664422"/>
<!-- Two wraps around pole -->
<path d="M20,118 L108,118 Q120,118 120,130 Q120,142 108,142 L20,130 Q8,130 8,120 Q8,112 20,118" fill="none" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<path d="M118,118 L200,118" fill="none" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<path d="M118,142 L200,142" fill="none" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<text x="12" y="166" font-family="monospace" font-size="10" fill="#00FF00">quick attach · adjustable</text>
<line x1="0" y1="173" x2="240" y2="173" stroke="#333" stroke-width="1"/>

<!-- FIGURE-8 (bottom third, y=174-240) -->
<text x="14" y="187" font-family="monospace" font-size="11" fill="#00FFFF">FIGURE-8</text>
<text x="150" y="187" font-family="monospace" font-size="10" fill="#FFFFFF">stopper/climb</text>
<!-- Figure-8 shape -->
<path d="M30,210 Q30,195 50,195 Q70,195 70,210 Q70,228 50,228 Q30,228 30,215 Q30,200 50,200" fill="none" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="210" r="0" fill="none"/>
<!-- End of rope -->
<line x1="30" y1="210" x2="10" y2="218" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<line x1="70" y1="200" x2="90" y2="195" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>
<text x="110" y="215" font-family="monospace" font-size="10" fill="#00FF00">stops rope pull-thru</text>
<text x="110" y="230" font-family="monospace" font-size="10" fill="#FFFFFF">strong · easy to undo</text>
</svg>
