<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">TINDER IDENTIFICATION</text>

<!-- Column headers -->
<text x="40" y="23" fill="#FFFFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">NATURAL</text>
<text x="120" y="23" fill="#FFFFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">FOUND/PROCESSED</text>
<text x="200" y="23" fill="#FFFFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">RATING</text>
<line x1="3" y1="26" x2="237" y2="26" stroke="#FFFFFF" stroke-width="0.5"/>
<line x1="80" y1="14" x2="80" y2="182" stroke="#FFFFFF" stroke-width="0.3" stroke-dasharray="2,2"/>
<line x1="160" y1="14" x2="160" y2="182" stroke="#FFFFFF" stroke-width="0.3" stroke-dasharray="2,2"/>

<!-- EXCELLENT section -->
<rect x="3" y="28" width="234" height="58" fill="#00FF00" fill-opacity="0.1" stroke="#00FF00" stroke-width="1"/>
<text x="6" y="37" fill="#00FF00" font-size="10.0" font-weight="bold" font-family="monospace">★ EXCELLENT</text>
<text x="6" y="47" fill="#00FF00" font-size="10.0" font-family="monospace">Dried grass</text>
<text x="6" y="56" fill="#00FF00" font-size="10.0" font-family="monospace">Birch bark</text>
<text x="6" y="65" fill="#00FF00" font-size="10.0" font-family="monospace">Dry pine needles</text>
<text x="6" y="74" fill="#00FF00" font-size="10.0" font-family="monospace">Dry leaves (crumble)</text>

<text x="83" y="47" fill="#00FF00" font-size="10.0" font-family="monospace">Cattail fluff</text>
<text x="83" y="56" fill="#00FF00" font-size="10.0" font-family="monospace">Fatwood shavings</text>
<text x="83" y="65" fill="#00FF00" font-size="10.0" font-family="monospace">Char cloth</text>
<text x="83" y="74" fill="#00FF00" font-size="10.0" font-family="monospace">Dryer lint (dry)</text>

<text x="163" y="47" fill="#00FF00" font-size="10.0" font-family="monospace">★★★★★</text>
<text x="163" y="56" fill="#00FF00" font-size="10.0" font-family="monospace">Ignites from</text>
<text x="163" y="65" fill="#00FF00" font-size="10.0" font-family="monospace">single spark</text>
<text x="163" y="74" fill="#00FF00" font-size="10.0" font-family="monospace">or ember</text>

<!-- GOOD section -->
<rect x="3" y="88" width="234" height="50" fill="#00FFFF" fill-opacity="0.1" stroke="#00FFFF" stroke-width="1"/>
<text x="6" y="97" fill="#00FFFF" font-size="10.0" font-weight="bold" font-family="monospace">◆ GOOD</text>
<text x="6" y="107" fill="#00FFFF" font-size="10.0" font-family="monospace">Dried leaves</text>
<text x="6" y="116" fill="#00FFFF" font-size="10.0" font-family="monospace">Dry moss</text>
<text x="6" y="125" fill="#00FFFF" font-size="10.0" font-family="monospace">Dry pine bark</text>

<text x="83" y="107" fill="#00FFFF" font-size="10.0" font-family="monospace">Cedar bark (shred)</text>
<text x="83" y="116" fill="#00FFFF" font-size="10.0" font-family="monospace">Amadou fungus</text>
<text x="83" y="125" fill="#00FFFF" font-size="10.0" font-family="monospace">Paper scraps</text>

<text x="163" y="107" fill="#00FFFF" font-size="10.0" font-family="monospace">★★★☆☆</text>
<text x="163" y="116" fill="#00FFFF" font-size="10.0" font-family="monospace">Needs prep</text>
<text x="163" y="125" fill="#00FFFF" font-size="10.0" font-family="monospace">or more heat</text>

<!-- POOR section -->
<rect x="3" y="140" width="234" height="42" fill="#FFFF00" fill-opacity="0.08" stroke="#FFFF00" stroke-width="1"/>
<text x="6" y="150" fill="#FFFF00" font-size="10.0" font-weight="bold" font-family="monospace">▼ POOR</text>
<text x="6" y="160" fill="#FFFF00" font-size="10.0" font-family="monospace">Green grass</text>
<text x="6" y="170" fill="#FFFF00" font-size="10.0" font-family="monospace">Damp materials</text>

<text x="83" y="160" fill="#FFFF00" font-size="10.0" font-family="monospace">Thick bark chunks</text>
<text x="83" y="170" fill="#FFFF00" font-size="10.0" font-family="monospace">Pine cones</text>

<text x="163" y="160" fill="#FFFF00" font-size="10.0" font-family="monospace">★☆☆☆☆</text>
<text x="163" y="170" fill="#FF4444" font-size="10.0" font-family="monospace">Avoid if possible</text>

<!-- Bottom rule -->
<line x1="3" y1="185" x2="237" y2="185" stroke="#FFFF00" stroke-width="0.5"/>
<text x="120" y="196" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">Crumbles to dust = EXCELLENT</text>
<text x="120" y="206" fill="#FF4444" font-size="10.0" text-anchor="middle" font-family="monospace">Bends without breaking = POOR</text>
<text x="120" y="218" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Process tinder before attempting ignition</text>
<text x="120" y="229" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">DRY + FINE + FLUFFY = fire ready</text>
</svg>
