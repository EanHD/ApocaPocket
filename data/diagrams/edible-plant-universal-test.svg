<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<rect width="240" height="240" fill="black"/>
<text x="120" y="13" font-family="monospace" font-size="12" fill="#FFFF00" text-anchor="middle">EDIBILITY TEST</text>

<!-- Step flow (left side numbers, right side text) -->
<text x="120" y="30" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">Takes 24+ hrs · One part at a time</text>

<!-- Steps 1-8 as numbered flow with colored bullets -->
<!-- Step 1 -->
<circle cx="18" cy="48" r="8" fill="#00FFFF"/>
<text x="18" y="52" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">1</text>
<text x="32" y="52" font-family="monospace" font-size="10" fill="#FFFFFF">Separate parts (leaf/root/stem)</text>

<!-- Step 2 -->
<circle cx="18" cy="68" r="8" fill="#00FFFF"/>
<text x="18" y="72" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">2</text>
<text x="32" y="72" font-family="monospace" font-size="10" fill="#FFFFFF">Smell test · bad odor = SKIP</text>

<!-- Step 3 -->
<circle cx="18" cy="88" r="8" fill="#FFFF00"/>
<text x="18" y="92" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">3</text>
<text x="32" y="92" font-family="monospace" font-size="10" fill="#FFFFFF">Skin contact test · wait 8hrs</text>

<!-- Step 4 -->
<circle cx="18" cy="108" r="8" fill="#FFFF00"/>
<text x="18" y="112" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">4</text>
<text x="32" y="112" font-family="monospace" font-size="10" fill="#FFFFFF">Touch to lips · wait 3min</text>

<!-- Step 5 -->
<circle cx="18" cy="128" r="8" fill="#FFFF00"/>
<text x="18" y="132" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">5</text>
<text x="32" y="132" font-family="monospace" font-size="10" fill="#FFFFFF">Touch to tongue · 15min</text>

<!-- Step 6 -->
<circle cx="18" cy="148" r="8" fill="#FF8800"/>
<text x="18" y="152" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">6</text>
<text x="32" y="152" font-family="monospace" font-size="10" fill="#FFFFFF">Chew · do NOT swallow · 15min</text>

<!-- Step 7 -->
<circle cx="18" cy="168" r="8" fill="#FF8800"/>
<text x="18" y="172" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">7</text>
<text x="32" y="172" font-family="monospace" font-size="10" fill="#FFFFFF">Swallow small bit · wait 8hrs</text>

<!-- Step 8 -->
<circle cx="18" cy="188" r="8" fill="#00FF00"/>
<text x="18" y="192" font-family="monospace" font-size="10" fill="#000" text-anchor="middle">8</text>
<text x="32" y="188" font-family="monospace" font-size="10" fill="#00FF00">No reaction → likely edible</text>

<!-- NEVER test section -->
<rect x="5" y="200" width="230" height="36" fill="#FF4444" fill-opacity="0.15" rx="2" stroke="#FF4444" stroke-width="1"/>
<text x="120" y="213" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">NEVER TEST: mushrooms · milky sap</text>
<text x="120" y="228" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">red berries · umbrella flowers</text>
<!-- Connector dots -->
<line x1="18" y1="56" x2="18" y2="60" stroke="#333" stroke-width="1"/>
<line x1="18" y1="76" x2="18" y2="80" stroke="#333" stroke-width="1"/>
<line x1="18" y1="96" x2="18" y2="100" stroke="#333" stroke-width="1"/>
<line x1="18" y1="116" x2="18" y2="120" stroke="#333" stroke-width="1"/>
<line x1="18" y1="136" x2="18" y2="140" stroke="#333" stroke-width="1"/>
<line x1="18" y1="156" x2="18" y2="160" stroke="#333" stroke-width="1"/>
<line x1="18" y1="176" x2="18" y2="180" stroke="#333" stroke-width="1"/>
</svg>
