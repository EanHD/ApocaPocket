<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">POT STILL DIAGRAM</text>

<!-- Heat source wavy lines -->
<path d="M22,155 Q27,150 32,155 Q37,160 42,155 Q47,150 52,155" fill="none" stroke="#FF4444" stroke-width="1.5"/>
<path d="M24,162 Q29,157 34,162 Q39,167 44,162 Q49,157 54,162" fill="none" stroke="#FF4444" stroke-width="1.5"/>
<text x="38" y="175" fill="#FF4444" font-size="10.0" text-anchor="middle" font-family="monospace">HEAT</text>

<!-- POT / BOILER -->
<ellipse cx="52" cy="130" rx="34" ry="22" fill="#221100" stroke="#00FFFF" stroke-width="2"/>
<rect x="18" y="110" width="68" height="20" fill="#221100" stroke="none"/>
<line x1="18" y1="110" x2="18" y2="138" stroke="#00FFFF" stroke-width="2"/>
<line x1="86" y1="110" x2="86" y2="138" stroke="#00FFFF" stroke-width="2"/>
<line x1="18" y1="138" x2="86" y2="138" stroke="#00FFFF" stroke-width="2"/>
<!-- Liquid inside pot -->
<ellipse cx="52" cy="130" rx="28" ry="8" fill="#003311" stroke="none"/>
<text x="52" y="118" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">MASH/</text>
<text x="52" y="126" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">LIQUID</text>
<text x="52" y="135" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">~wash fill</text>

<!-- POT label -->
<text x="52" y="148" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">BOILER/POT</text>

<!-- Lid on top of pot -->
<ellipse cx="52" cy="108" rx="36" ry="6" fill="#333322" stroke="#FFFF00" stroke-width="1.5"/>
<text x="52" y="100" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">Lid sealed</text>
<text x="52" y="107" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">w/dough/tape</text>

<!-- Pipe from top of pot going right then up then right to condenser -->
<line x1="88" y1="108" x2="112" y2="108" stroke="#FFFFFF" stroke-width="2"/>
<line x1="112" y1="108" x2="112" y2="85" stroke="#FFFFFF" stroke-width="2"/>
<line x1="112" y1="85" x2="138" y2="85" stroke="#FFFFFF" stroke-width="2"/>

<!-- Vapor label -->
<text x="100" y="80" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">vapor rises</text>
<polygon points="112,85 107,78 117,78" fill="#FFFFFF"/>

<!-- CONDENSER - cold water bath -->
<rect x="138" y="72" width="62" height="78" fill="#001122" stroke="#00FFFF" stroke-width="1.5" rx="3"/>
<text x="169" y="82" fill="#00FFFF" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">CONDENSER</text>
<text x="169" y="90" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">cold water bath</text>

<!-- Coil inside condenser -->
<path d="M138,95 Q153,92 153,100 Q153,108 138,108" fill="none" stroke="#FFFF00" stroke-width="2"/>
<path d="M138,108 Q153,105 153,113 Q153,121 138,121" fill="none" stroke="#FFFF00" stroke-width="2"/>
<path d="M138,121 Q153,118 153,126 Q153,134 138,134" fill="none" stroke="#FFFF00" stroke-width="2"/>
<text x="169" y="112" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">COIL</text>
<text x="169" y="120" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">cools vapor</text>
<text x="169" y="128" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">to liquid</text>
<text x="169" y="142" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">All joints</text>
<text x="169" y="149" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">sealed!</text>

<!-- Drip from condenser -->
<line x1="138" y1="140" x2="115" y2="140" stroke="#00FF00" stroke-width="2"/>
<line x1="115" y1="140" x2="115" y2="160" stroke="#00FF00" stroke-width="2"/>
<polygon points="115,165 110,157 120,157" fill="#00FF00"/>

<!-- Collection vessel -->
<rect x="95" y="165" width="40" height="30" fill="#001100" stroke="#00FF00" stroke-width="1.5" rx="2"/>
<text x="115" y="178" fill="#00FF00" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">OUTPUT</text>
<text x="115" y="188" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">COLLECT</text>

<!-- Foreshot label -->
<text x="62" y="165" fill="#FF4444" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">FORESHOTS:</text>
<text x="62" y="173" fill="#FF4444" font-size="10.0" text-anchor="middle" font-family="monospace">First 50ml</text>
<text x="62" y="180" fill="#FF4444" font-size="10.0" text-anchor="middle" font-family="monospace">DISCARD!</text>
<text x="62" y="188" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">(methanol)</text>

<!-- Boiling points note -->
<line x1="2" y1="200" x2="238" y2="200" stroke="#444444" stroke-width="1"/>
<text x="120" y="210" fill="#00FFFF" font-size="10.0" text-anchor="middle" font-family="monospace">EtOH boils 78°C  |  Water boils 100°C</text>
<text x="120" y="220" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Vapor rises, cools in coil, condenses to liquid</text>

<!-- Warning -->
<rect x="2" y="226" width="236" height="12" fill="#330000" stroke="#FF4444" stroke-width="1" rx="1"/>
<text x="120" y="235" fill="#FF4444" font-size="10.0" font-weight="bold" text-anchor="middle" font-family="monospace">FIRE HAZARD — No open flame near output</text>
</svg>
