<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">SIGNAL FIRES</text>

<!-- Section divider -->
<line x1="4" y1="100" x2="236" y2="100" stroke="#333333" stroke-width="1"/>
<line x1="4" y1="155" x2="236" y2="155" stroke="#333333" stroke-width="1"/>

<!-- TOP: Triangle pattern -->
<text x="120" y="23" fill="#00FFFF" font-size="11.2" font-weight="bold" text-anchor="middle" font-family="monospace">DISTRESS PATTERN — 3 FIRES</text>

<!-- Triangle of 3 fires -->
<!-- Fire 1 (top) -->
<g transform="translate(120,40)">
  <polygon points="0,-10 -8,5 8,5" fill="#FF8800"/>
  <polygon points="0,-6 -5,4 5,4" fill="#FFFF00"/>
  <rect x="-6" y="5" width="12" height="3" fill="#885533"/>
</g>
<!-- Fire 2 (bottom left) -->
<g transform="translate(72,78)">
  <polygon points="0,-10 -8,5 8,5" fill="#FF8800"/>
  <polygon points="0,-6 -5,4 5,4" fill="#FFFF00"/>
  <rect x="-6" y="5" width="12" height="3" fill="#885533"/>
</g>
<!-- Fire 3 (bottom right) -->
<g transform="translate(168,78)">
  <polygon points="0,-10 -8,5 8,5" fill="#FF8800"/>
  <polygon points="0,-6 -5,4 5,4" fill="#FFFF00"/>
  <rect x="-6" y="5" width="12" height="3" fill="#885533"/>
</g>
<!-- Triangle lines -->
<line x1="120" y1="45" x2="72" y2="73" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="120" y1="45" x2="168" y2="73" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="72" y1="83" x2="168" y2="83" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
<!-- Distance label -->
<text x="120" y="96" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">30m apart min · or 3 in a LINE</text>

<!-- MIDDLE: Smoke types -->
<text x="120" y="110" fill="#00FFFF" font-size="11.2" font-weight="bold" text-anchor="middle" font-family="monospace">SMOKE SIGNALS</text>

<!-- DAY: white smoke -->
<text x="60" y="122" fill="#FFFF00" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="monospace">DAY</text>
<g transform="translate(60,137)">
  <polygon points="0,-10 -8,5 8,5" fill="#FF8800"/>
  <polygon points="0,-6 -5,4 5,4" fill="#FFFF00"/>
  <rect x="-6" y="5" width="12" height="3" fill="#885533"/>
</g>
<!-- White smoke plume -->
<path d="M 60 127 Q 55 118 58 110 Q 62 104 60 97" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.7"/>
<path d="M 60 127 Q 65 116 62 108 Q 58 102 63 95" stroke="#CCCCCC" stroke-width="2" fill="none" opacity="0.5"/>
<text x="60" y="150" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">green wood</text>
<text x="60" y="157" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">leaves/grass</text>

<!-- NIGHT: bright flame -->
<text x="180" y="122" fill="#FFFF00" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="monospace">NIGHT</text>
<g transform="translate(180,137)">
  <polygon points="0,-14 -10,6 10,6" fill="#FF4444"/>
  <polygon points="0,-10 -7,5 7,5" fill="#FF8800"/>
  <polygon points="0,-6 -4,4 4,4" fill="#FFFF00"/>
  <rect x="-8" y="6" width="16" height="3" fill="#885533"/>
</g>
<text x="180" y="150" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">dry wood</text>
<text x="180" y="157" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">resin/fat</text>

<!-- Labels center -->
<text x="120" y="132" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">white smoke</text>
<text x="120" y="140" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">= best day vis</text>
<text x="120" y="150" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">bright flame</text>
<text x="120" y="158" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">= best night</text>

<!-- BOTTOM: Signal mirror -->
<text x="120" y="167" fill="#00FFFF" font-size="11.2" font-weight="bold" text-anchor="middle" font-family="monospace">SIGNAL MIRROR</text>

<!-- Mirror diagram -->
<rect x="12" y="173" width="18" height="14" fill="#888888" stroke="#00FFFF" stroke-width="1"/>
<text x="21" y="183" fill="#000000" font-size="10.0" text-anchor="middle" font-family="monospace">MIR</text>
<!-- Light beam to target -->
<line x1="30" y1="180" x2="100" y2="185" stroke="#FFFF00" stroke-width="2" stroke-dasharray="4,2"/>
<!-- Target aircraft -->
<text x="110" y="188" fill="#00FFFF" font-size="12" font-family="monospace">✈</text>
<!-- Reflection beam -->
<line x1="30" y1="180" x2="80" y2="170" stroke="#FFFF00" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

<text x="120" y="202" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Aim reflected flash at aircraft · 3 flashes pause = SOS</text>
<text x="120" y="212" fill="#FFFF00" font-size="10.0" text-anchor="middle" font-family="monospace">Range: 160km clear day</text>

<!-- Improvised mirrors -->
<rect x="4" y="218" width="232" height="19" fill="#111111" stroke="#555555" stroke-width="1"/>
<text x="120" y="227" fill="#FFFFFF" font-size="10.0" text-anchor="middle" font-family="monospace">Improvised: car mirror · CD · phone screen · foil</text>
<text x="120" y="235" fill="#AAAAAA" font-size="10.0" text-anchor="middle" font-family="monospace">Also: bright clothes flat on ground, smoke, whistle 3x</text>
</svg>
