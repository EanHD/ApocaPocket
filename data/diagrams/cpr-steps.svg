<svg width="240" height="240" xmlns="http://www.w3.org/2000/svg">
<rect width="240" height="240" fill="black"/>
<text x="120" y="12" fill="#FFFF00" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">CPR — ADULT</text>

<!-- Step 1: CHECK -->
<rect x="4" y="17" width="232" height="30" fill="#111111" stroke="#00FFFF" stroke-width="1"/>
<text x="22" y="27" fill="#00FFFF" font-size="12.6" font-weight="bold" font-family="monospace">1 CHECK</text>
<text x="22" y="38" fill="#FFFFFF" font-size="10.5" font-family="monospace">Tap &amp; shout — unresponsive? No breathing?</text>
<!-- Stick figure -->
<circle cx="210" cy="24" r="4" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<line x1="210" y1="28" x2="210" y2="38" stroke="#FFFFFF" stroke-width="1"/>
<line x1="204" y1="32" x2="216" y2="32" stroke="#FFFFFF" stroke-width="1"/>
<line x1="210" y1="38" x2="205" y2="44" stroke="#FFFFFF" stroke-width="1"/>
<line x1="210" y1="38" x2="215" y2="44" stroke="#FFFFFF" stroke-width="1"/>

<!-- Arrow -->
<line x1="120" y1="47" x2="120" y2="52" stroke="#FFFFFF" stroke-width="1"/>
<polygon points="116,52 124,52 120,56" fill="#FFFFFF"/>

<!-- Step 2: CALL -->
<rect x="4" y="56" width="232" height="18" fill="#111111" stroke="#FFFF00" stroke-width="1"/>
<text x="22" y="66" fill="#FFFF00" font-size="12.6" font-weight="bold" font-family="monospace">2 CALL FOR HELP — START TIMER</text>

<!-- Arrow -->
<line x1="120" y1="74" x2="120" y2="79" stroke="#FFFFFF" stroke-width="1"/>
<polygon points="116,79 124,79 120,83" fill="#FFFFFF"/>

<!-- Step 3: COMPRESSIONS -->
<rect x="4" y="83" width="232" height="55" fill="#111111" stroke="#00FF00" stroke-width="1"/>
<text x="22" y="93" fill="#00FF00" font-size="12.6" font-weight="bold" font-family="monospace">3  30 COMPRESSIONS</text>
<!-- Lying figure with hands on chest -->
<line x1="22" y1="110" x2="90" y2="110" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="22" cy="106" r="5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<rect x="46" y="107" width="20" height="6" fill="#00FFFF" stroke="#00FFFF" stroke-width="0.5"/>
<text x="46" y="113" fill="#FFFF00" font-size="10.0" font-family="monospace">hands</text>
<!-- Arrows showing compression -->
<line x1="56" y1="100" x2="56" y2="107" stroke="#FF4444" stroke-width="1.5"/>
<polygon points="52,107 60,107 56,111" fill="#FF4444"/>
<line x1="56" y1="126" x2="56" y2="120" stroke="#FF4444" stroke-width="1.5"/>
<polygon points="52,120 60,120 56,116" fill="#FF4444"/>
<!-- Depth indicator -->
<text x="62" y="107" fill="#FF4444" font-size="10.0" font-family="monospace">5-6cm</text>

<text x="105" y="103" fill="#FFFFFF" font-size="10.0" font-family="monospace">· Center chest, 2 hands</text>
<text x="105" y="113" fill="#FFFFFF" font-size="10.0" font-family="monospace">· Push 5-6cm deep</text>
<text x="105" y="123" fill="#FFFFFF" font-size="10.0" font-family="monospace">· 100-120/min rate</text>
<text x="105" y="133" fill="#FFFFFF" font-size="10.0" font-family="monospace">· Full chest recoil</text>

<!-- Arrow -->
<line x1="120" y1="138" x2="120" y2="143" stroke="#FFFFFF" stroke-width="1"/>
<polygon points="116,143 124,143 120,147" fill="#FFFFFF"/>

<!-- Step 4: RESCUE BREATHS -->
<rect x="4" y="147" width="232" height="47" fill="#111111" stroke="#00FFFF" stroke-width="1"/>
<text x="22" y="157" fill="#00FFFF" font-size="12.6" font-weight="bold" font-family="monospace">4  2 RESCUE BREATHS</text>
<!-- Head tilt / chin lift diagram -->
<line x1="22" y1="175" x2="75" y2="175" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="22" cy="170" r="5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
<!-- Head tilt arrow -->
<path d="M 22 165 Q 30 158 38 162" stroke="#FFFF00" stroke-width="1" fill="none"/>
<polygon points="35,160 40,165 38,162" fill="#FFFF00"/>
<text x="42" y="163" fill="#FFFF00" font-size="10.0" font-family="monospace">tilt back</text>
<!-- Breath arrow -->
<line x1="22" y1="170" x2="8" y2="170" stroke="#00FFFF" stroke-width="1"/>
<polygon points="8,167 2,170 8,173" fill="#00FFFF"/>
<text x="2" y="185" fill="#FFFF00" font-size="10.0" font-family="monospace">blow</text>

<text x="105" y="168" fill="#FFFFFF" font-size="10.0" font-family="monospace">· Tilt head, lift chin</text>
<text x="105" y="178" fill="#FFFFFF" font-size="10.0" font-family="monospace">· 1 sec per breath</text>
<text x="105" y="188" fill="#FFFFFF" font-size="10.0" font-family="monospace">· Watch chest rise</text>

<!-- Arrow -->
<line x1="120" y1="194" x2="120" y2="199" stroke="#FFFFFF" stroke-width="1"/>
<polygon points="116,199 124,199 120,203" fill="#FFFFFF"/>

<!-- Step 5: REPEAT -->
<rect x="4" y="203" width="232" height="14" fill="#222200" stroke="#FFFF00" stroke-width="1"/>
<text x="120" y="213" fill="#FFFF00" font-size="11.2" font-weight="bold" text-anchor="middle" font-family="monospace">5  REPEAT 30:2 until AED / help arrives</text>

<!-- Hands-only note -->
<rect x="4" y="221" width="232" height="16" fill="#002200" stroke="#00FF00" stroke-width="1"/>
<text x="120" y="230" fill="#00FF00" font-size="10.0" text-anchor="middle" font-family="monospace">HANDS-ONLY if untrained: compressions only, no stops</text>
</svg>
